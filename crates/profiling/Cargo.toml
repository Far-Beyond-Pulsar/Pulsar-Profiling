[package]
name = "profiling"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Far-Beyond-Pulsar/Pulsar-Profiling"
rust-version = "1.81"
authors = ["Tristan J. Poland"]
publish = false

# No workspace inheritance: hosts build this crate as a path dependency from
# inside their own workspace (Pulsar-Native's submodule), where cargo would
# resolve `workspace = true` against the host's root instead of this one.
[dependencies]
parking_lot = "0.12"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
once_cell = "1.20"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
memmap2 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "profiling"
path = "src/lib.rs"
